name: Cypress PR Regression
run-name: Cypress PR Regression - PR#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  SPECS_PER_CONTAINER: 4
  CYPRESS_BRANCH: develop
  MERGE_CONFIDENCE_THRESHOLD: 60

  # `pages:write` + `id-token:write` are required for actions/deploy-pages (GitHub Actions → Pages).
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  set-globals:
    if: ${{ !contains(github.event.pull_request.head.user.login, 'github-actions')   }}
    runs-on: ubuntu-latest
    outputs:
      MATRIX_CONFIG: ${{ steps.cypress-strategy-config.outputs.MATRIX_CONFIG }}
      SPECS_PATTERN: ${{ steps.cypress-strategy-config.outputs.SPECS_PATTERN }}
      RUN_FLAG: ${{ steps.cypress-strategy-config.outputs.RUN_FLAG }}
      chrome_version: ${{ steps.find-chrome-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # Caches ~/.cache/Cypress and ~/.npm
      - name: NPM install
        uses: cypress-io/github-action@v7
        with:
          install: true
          runTests: false

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vite.cypress.config.ts'
            backend:
              - 'backend/**'
            shared:
              - 'cypress/**'
              - 'package.json'
              - 'package-lock.json'
              - 'data/**'
              - '.github/workflows/**'

      - name: Determine Change Type
        id: change-type
        run: |
          FRONTEND="${{ steps.changes.outputs.frontend }}"
          BACKEND="${{ steps.changes.outputs.backend }}"
          SHARED="${{ steps.changes.outputs.shared }}"
          
          echo "Frontend changes: $FRONTEND"
          echo "Backend changes: $BACKEND"
          echo "Shared changes: $SHARED"
          
          if [[ "$FRONTEND" == "true" && "$BACKEND" == "false" && "$SHARED" == "false" ]]; then
            echo "type=frontend-only" >> $GITHUB_OUTPUT
            echo "Frontend-only changes detected"
          elif [[ "$BACKEND" == "true" && "$FRONTEND" == "false" && "$SHARED" == "false" ]]; then
            echo "type=backend-only" >> $GITHUB_OUTPUT
            echo "Backend-only changes detected"
          else
            echo "type=full-stack" >> $GITHUB_OUTPUT
            echo "Full-stack changes detected"
          fi

      - name: Get PR Files
        id: get-pr
        env:
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          REPO_PATH: "${{ github.repository }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # Get list of changed files in the PR
          FILES=$(gh pr view $PR_NUMBER --json files --jq '.files[].path' | tr '\n' ',' | sed 's/,$//')
          echo "pr-files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"
          echo "Change type: ${{ steps.change-type.outputs.type }}"

      - name: Select Coverage Map Based on Change Type
        id: prepare-coverage-map
        run: |
          CHANGE_TYPE="${{ steps.change-type.outputs.type }}"
          
          echo "Change type: $CHANGE_TYPE"
          echo "Checking for coverage maps in artifacts/ folder..."
          
          # Check which coverage maps exist in the repo's artifacts folder
          HAS_FRONTEND="false"
          HAS_BACKEND="false"
          
          if [ -f "artifacts/frontend-coverage-map.json" ]; then
            HAS_FRONTEND="true"
            echo "Frontend coverage map found in repo"
          else
            echo "Frontend coverage map not found in repo"
          fi
          
          if [ -f "artifacts/backend-coverage-map.json" ]; then
            HAS_BACKEND="true"
            echo "Backend coverage map found in repo"
          else
            echo "Backend coverage map not found in repo"
          fi
          
          # Determine which coverage map to use for spec filtering
          if [[ "$CHANGE_TYPE" == "frontend-only" && "$HAS_FRONTEND" == "true" ]]; then
            cp artifacts/frontend-coverage-map.json coverage-map.json
            echo "has-coverage-map=true" >> $GITHUB_OUTPUT
            echo "Using frontend coverage map for filtering"
          elif [[ "$CHANGE_TYPE" == "backend-only" && "$HAS_BACKEND" == "true" ]]; then
            cp artifacts/backend-coverage-map.json coverage-map.json
            echo "has-coverage-map=true" >> $GITHUB_OUTPUT
            echo "Using backend coverage map for filtering"
          elif [[ "$CHANGE_TYPE" == "full-stack" ]]; then
            # For full-stack changes, use frontend map as primary (most UI tests)
            if [[ "$HAS_FRONTEND" == "true" ]]; then
              cp artifacts/frontend-coverage-map.json coverage-map.json
              echo "has-coverage-map=true" >> $GITHUB_OUTPUT
              echo "Using frontend coverage map for full-stack changes"
            elif [[ "$HAS_BACKEND" == "true" ]]; then
              cp artifacts/backend-coverage-map.json coverage-map.json
              echo "has-coverage-map=true" >> $GITHUB_OUTPUT
              echo "Using backend coverage map for full-stack changes"
            else
              echo "has-coverage-map=false" >> $GITHUB_OUTPUT
              echo "No coverage maps available - will run all tests"
            fi
          else
            echo "has-coverage-map=false" >> $GITHUB_OUTPUT
            echo "No coverage maps available for change type: $CHANGE_TYPE"
          fi

      - name: Cypress Relevant Tests
        if: steps.prepare-coverage-map.outputs.has-coverage-map == 'true'
        id: cypress-relevant-tests
        env:
          MAP_FILE_PATH: coverage-map.json
          PR_FILENAMES: ${{ steps.get-pr.outputs.pr-files }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          GITHUB_REPO_PATH: "${{ github.repository }}"
          SPECS_PER_CONTAINER: ${{ env.SPECS_PER_CONTAINER }}
        run: |
          python .github/scripts/cypress-src-to-specs-filter.py

      - name: Cypress Strategy Config
        id: cypress-strategy-config
        run: |
          HAS_COVERAGE_MAP="${{ steps.prepare-coverage-map.outputs.has-coverage-map }}"
          
          if [[ "$HAS_COVERAGE_MAP" == "true" ]]; then
            # Use filtered specs from coverage map
            echo "RUN_FLAG=true" >> $GITHUB_OUTPUT
            echo "SPECS_PATTERN=${{ steps.cypress-relevant-tests.outputs.spec-paths }}" >> $GITHUB_OUTPUT
            echo "MATRIX_CONFIG=${{ steps.cypress-relevant-tests.outputs.cypress-matrix }}" >> $GITHUB_OUTPUT
          else
            # No coverage map available, run all tests
            echo "RUN_FLAG=true" >> $GITHUB_OUTPUT
            echo "SPECS_PATTERN=cypress/src/ui/*.spec.ts" >> $GITHUB_OUTPUT
            echo "MATRIX_CONFIG=[1, 2, 3, 4]" >> $GITHUB_OUTPUT
          fi

      - name: Echo Cypress Strategy Config
        run: |
          echo "RUN_FLAG: ${{ steps.cypress-strategy-config.outputs.RUN_FLAG }}"
          echo "MATRIX_CONFIG: ${{ steps.cypress-strategy-config.outputs.MATRIX_CONFIG }}"
          echo "SPECS_PATTERN: ${{ steps.cypress-strategy-config.outputs.SPECS_PATTERN }}"

      - name: Setup Chrome and Get Version
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Extract Chrome Version
        id: find-chrome-version
        run: |
          CHROME_VERSION=$(chrome --version | awk '{print $NF}')
          echo "Chrome stable version: $CHROME_VERSION"
          echo "version=$CHROME_VERSION" >> $GITHUB_OUTPUT

  regression-testing:
    needs: [set-globals]
    if: ${{ needs.set-globals.outputs.RUN_FLAG == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJson(needs.set-globals.outputs.MATRIX_CONFIG) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm i

      - name: Setup Mock AWS Exports
        run: npm run predev:cognito:ci

      - name: Seed Database
        run: npm run db:seed:dev

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ needs.set-globals.outputs.chrome_version }}

      - name: Chrome Symlink
        id: chrome-symlink
        run: |
          CHROME_PATH=$(which chrome)
          echo "Chrome Path: $CHROME_PATH"
          sudo ln -sf $CHROME_PATH /usr/local/bin/chrome

      - name: Assert Chrome Version
        run: |
          echo "Chrome Version"
          echo "--------------"
          chrome --version
          echo "--------------"

      - name: Start Dev Servers
        run: |
          npm run dev:coverage >> dev-servers-${{ strategy.job-index }}.log 2>&1 &
          npx wait-on http://localhost:3000/signin -t 120000
          echo 'http://localhost:3000/signin is up and running!'
          npx wait-on http://localhost:3001 -t 120000
          echo 'http://localhost:3001 is up and running!'
        env:
          NODE_ENV: development
          CYPRESS_COVERAGE: true

      - name: Cypress Regression Tests
        uses: cypress-io/github-action@v7
        timeout-minutes: 20
        with:
          build: npx cypress info
          config: numTestsKeptInMemory=0
          install: false
          browser: chrome
          spec: ${{ needs.set-globals.outputs.SPECS_PATTERN }}
        env:
          TZ: America/Los_Angeles
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          SPEC: ${{ needs.set-globals.outputs.SPECS_PATTERN }}
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          ELECTRON_EXTRA_LAUNCH_ARGS: |
             --disable-gpu
             --disable-software-rasterizer

      - name: Rename verbose reports with job index
        if: always()
        run: |
          # Rename verbose metadata file with job index
          if [ -f cypress/results/reports/verbose/verbose-metadata.json ]; then
            mv cypress/results/reports/verbose/verbose-metadata.json cypress/results/reports/verbose/verbose-metadata-${{ strategy.job-index }}.json
            echo "Renamed verbose-metadata.json to verbose-metadata-${{ strategy.job-index }}.json"
          else
            echo "verbose-metadata.json not found, skipping rename"
          fi

      - name: Output Dev Server Logs
        if: always()
        run: |
          echo "========== Dev Server Logs =========="
          cat dev-servers-${{ strategy.job-index }}.log || echo "No dev server logs found"

      - name: Upload Dev Server Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-server-logs-${{ strategy.job-index }}
          path: dev-servers-${{ strategy.job-index }}.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Persist Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts-${{ strategy.job-index }}
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results/reports/verbose
            cypress/results/reports/allure-results
          retention-days: 3
          if-no-files-found: ignore

  # Generate and deploy Allure report to GitHub Pages
  allure-report:
    needs: [set-globals, regression-testing]
    if: always() && needs.set-globals.outputs.RUN_FLAG == 'true'
    uses: ./.github/workflows/allure-gh-pages.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_sha: ${{ github.event.pull_request.head.sha }}
      run_id: ${{ github.run_id }}
      deployment_type: 'pr'

  # Call reusable workflow for AI analysis
  cypress-results:
    needs: [set-globals, regression-testing]
    if: always()
    uses: ./.github/workflows/cypress-ai-analysis.yml
    secrets: inherit
    with:
      regression_result: ${{ needs.regression-testing.result }}
      run_flag: ${{ needs.set-globals.outputs.RUN_FLAG }}
      merge_confidence_threshold: 60
      pr_number: ${{ github.event.pull_request.number }}
      pr_sha: ${{ github.event.pull_request.head.sha }}
