name: Coverage Map Generation 📝
run-name: Coverage Map Generation 📝

on:
  workflow_dispatch:

concurrency:
  group: coverage-map-generation
  cancel-in-progress: true

env:
  COVERAGE_MAP_PATH: 'cypress/results/reports/coverage-map'
  FRONTEND_COVERAGE_MAP_NAME: 'coverage-map.json'
  BACKEND_COVERAGE_MAP_NAME: 'node-coverage-map.json'

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # Caches ~/.cache/Cypress and ~/.npm
      - name: NPM install
        uses: cypress-io/github-action@v7
        with:
          install: true
          runTests: false

  coverage-tests:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm i

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Get Chrome Path
        id: which_chrome
        run: echo "BROWSER=$(which chrome)" >> $GITHUB_OUTPUT

      - name: Setup Mock AWS Exports
        run: npm run predev:cognito:ci

      - name: Seed Database
        run: npm run db:seed:dev

      - name: Start Dev Servers
        run: |
          npm run dev:coverage >> dev-servers-${{ strategy.job-index }}.log 2>&1 &
          npx wait-on http://localhost:3000/signin -t 120000
          echo 'http://localhost:3000/signin is up and running!'
          npx wait-on http://localhost:3001 -t 120000
          echo 'http://localhost:3001 is up and running!'
        env:
          NODE_ENV: development
          CYPRESS_COVERAGE: true

      - name: Localhost Health-Check
        run: |
          echo "Pinging front-end..."
          echo "---------------------------------------------------------------"
          curl --location 'http://localhost:3000/signin'

          echo "---------------------------------------------------------------"
          echo "Pinging back-end..."
          echo "---------------------------------------------------------------"
          curl --location 'http://localhost:3001'

      - name: Run UI Tests with Fullstack Coverage
        uses: cypress-io/github-action@v7
        timeout-minutes: 20
        with:
          build: npx cypress info
          config: numTestsKeptInMemory=0
          install: false
          browser: ${{ steps.which_chrome.outputs.BROWSER }}
          spec: cypress/src/ui/*.spec.ts
        env:
          TZ: America/Los_Angeles
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          SPEC: cypress/src/ui/*.spec.ts
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}

      - name: Output Dev Server Logs
        if: always()
        run: |
          echo "========== Dev Server Logs =========="
          cat dev-servers-${{ strategy.job-index }}.log || echo "No dev server logs found"

      - name: Rename Frontend Coverage Map
        id: frontend-coverage-map
        env:
          FILE_PATH: ${{ env.COVERAGE_MAP_PATH }}
          FILE_NAME: ${{ env.FRONTEND_COVERAGE_MAP_NAME }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          if [ -f "$FILE_PATH/$FILE_NAME" ]; then
            mv $FILE_PATH/$FILE_NAME $FILE_PATH/frontend-coverage-$JOB_INDEX-$FILE_NAME
            echo "MAP_PATH=$FILE_PATH/frontend-coverage-$JOB_INDEX-$FILE_NAME" >> $GITHUB_OUTPUT
          else
            echo "Frontend coverage map not found: $FILE_PATH/$FILE_NAME (skipping)"
          fi

      - name: Rename Backend Coverage Map
        id: backend-coverage-map
        env:
          FILE_PATH: ${{ env.COVERAGE_MAP_PATH }}
          FILE_NAME: ${{ env.BACKEND_COVERAGE_MAP_NAME }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          if [ -f "$FILE_PATH/$FILE_NAME" ]; then
            mv $FILE_PATH/$FILE_NAME $FILE_PATH/backend-coverage-$JOB_INDEX-$FILE_NAME
            echo "MAP_PATH=$FILE_PATH/backend-coverage-$JOB_INDEX-$FILE_NAME" >> $GITHUB_OUTPUT
          else
            echo "Backend coverage map not found: $FILE_PATH/$FILE_NAME (skipping)"
          fi

      - name: Persist Frontend Coverage Map
        if: ${{ steps.frontend-coverage-map.outputs.MAP_PATH != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ strategy.job-index }}
          path: ${{ steps.frontend-coverage-map.outputs.MAP_PATH }}
          retention-days: 1

      - name: Persist Backend Coverage Map
        if: ${{ steps.backend-coverage-map.outputs.MAP_PATH != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ strategy.job-index }}
          path: ${{ steps.backend-coverage-map.outputs.MAP_PATH }}
          retention-days: 1

      - name: Upload Dev Server Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-server-logs-${{ strategy.job-index }}
          path: dev-servers-${{ strategy.job-index }}.log
          retention-days: 1
          if-no-files-found: ignore

  coverage-map-merge:
    needs: [init, coverage-tests]
    if: ${{ always() && needs.coverage-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Get Frontend Coverage Map Files
        id: frontend-map-files
        run: |
          FRONTEND_FILES=$(find artifacts -name 'frontend-coverage-*-coverage-map.json' | sed 's/\.\///g' | tr '\n' ' ')
          echo "json-files=$FRONTEND_FILES" >> $GITHUB_OUTPUT
          echo "Frontend coverage maps: $FRONTEND_FILES"

      - name: Get Backend Coverage Map Files
        id: backend-map-files
        run: |
          BACKEND_FILES=$(find artifacts -name 'backend-coverage-*-node-coverage-map.json' | sed 's/\.\///g' | tr '\n' ' ')
          echo "json-files=$BACKEND_FILES" >> $GITHUB_OUTPUT
          echo "Backend coverage maps: $BACKEND_FILES"

      - name: Merge Frontend Coverage Maps
        if: ${{ steps.frontend-map-files.outputs.json-files != '' }}
        env:
          JSON_FILES: ${{ steps.frontend-map-files.outputs.json-files }}
          MERGED_REPORT_PATH: artifacts/frontend-coverage-map.json
        run: python .github/scripts/merge-coverage-map.py

      - name: Merge Backend Coverage Maps
        if: ${{ steps.backend-map-files.outputs.json-files != '' }}
        env:
          JSON_FILES: ${{ steps.backend-map-files.outputs.json-files }}
          MERGED_REPORT_PATH: artifacts/backend-coverage-map.json
        run: python .github/scripts/merge-coverage-map.py

      - name: Upload Merged Frontend Coverage Map
        if: ${{ steps.frontend-map-files.outputs.json-files != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: merged-frontend-coverage-map
          path: artifacts/frontend-coverage-map.json
          retention-days: 30

      - name: Upload Merged Backend Coverage Map
        if: ${{ steps.backend-map-files.outputs.json-files != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: merged-backend-coverage-map
          path: artifacts/backend-coverage-map.json
          retention-days: 30

      - name: Create Artifacts Directory
        run: mkdir -p artifacts

      - name: Copy Coverage Maps to Artifacts Folder
        run: |
          if [ -f "artifacts/frontend-coverage-map.json" ]; then
            echo "Frontend coverage map ready for commit"
          fi
          if [ -f "artifacts/backend-coverage-map.json" ]; then
            echo "Backend coverage map ready for commit"
          fi

      - name: Commit and Push Coverage Maps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "Adding coverage maps to git..."
          git add artifacts/frontend-coverage-map.json artifacts/backend-coverage-map.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coverage maps (frontend + backend)"
            echo "Pushing to remote..."
            git push
          fi
